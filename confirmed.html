<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're in — Folio</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ivory:   #FBF9F4;
      --cloud:   #F1EEE6;
      --fog:     #DEDCD3;
      --charcoal:#2E2C28;
      --secondary:#84837C;
      --blue:    #5B7C99;
      --blue-light:#DCE6ED;
      --brass:   #B8935A;
    }

    body {
      background: var(--ivory);
      color: var(--charcoal);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 48px;
      border-bottom: 1px solid var(--fog);
    }

    .nav-wordmark {
      font-family: 'Lora', Georgia, serif;
      font-size: 20px;
      font-weight: 500;
      color: var(--charcoal);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--secondary);
      text-decoration: none;
      transition: color 0.15s;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--blue);
    }

    /* ── Brass rule ── */
    .brass-rule {
      width: 48px;
      height: 2px;
      background: var(--brass);
      border: none;
      margin: 0 auto 40px;
    }

    /* ── Page content ── */
    .page {
      flex: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 80px 24px 80px;
      width: 100%;
      text-align: center;
    }

    .page-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 20px;
    }

    .page-title {
      font-family: 'Lora', Georgia, serif;
      font-size: 40px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .page-intro {
      font-size: 17px;
      color: var(--secondary);
      line-height: 1.65;
      margin-bottom: 48px;
    }

    .page-hand {
      font-family: 'Caveat', cursive;
      font-size: 30px;
      font-weight: 500;
      color: #8A6A3A;
      margin-bottom: 8px;
    }

    .get-app {
      font-size: 15px;
      color: var(--secondary);
    }

    .get-app a {
      color: var(--blue);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid var(--blue-light);
      padding-bottom: 2px;
      transition: border-color 0.15s, color 0.15s;
    }

    .get-app a:hover { color: #4a6b87; border-color: var(--blue); }

    /* ── Footer ── */
    footer {
      padding: 32px 48px;
      border-top: 1px solid var(--fog);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-copy { font-size: 13px; color: var(--secondary); }

    .footer-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .footer-links a {
      font-size: 13px;
      color: var(--secondary);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-links a:hover { color: var(--blue); }

    @media (max-width: 600px) {
      nav { padding: 20px 24px; }
      .page { padding: 64px 24px; }
      footer { padding: 28px 24px; flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-wordmark">Folio</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="support.html">Support</a></li>
      <li><a href="privacy.html">Privacy</a></li>
    </ul>
  </nav>

  <main>
    <section class="page">
      <p class="page-hand">the shelves are ready</p>
      <h1 class="page-title">You're in!</h1>
      <hr class="brass-rule">
      <p class="page-intro">Your email is confirmed. Head back to Folio and sign in — your books are waiting.</p>
      <p class="get-app"><em>Don't have the app yet?</em> <a href="https://apps.apple.com/us/app/folio-library/id6792103604">Get Folio on the App Store</a></p>
    </section>
  </main>

  <footer>
    <p class="footer-copy">© 2026 Folio</p>
    <ul class="footer-links">
      <li><a href="support.html">Support</a></li>
      <li><a href="privacy.html">Privacy Policy</a></li>
    </ul>
  </footer>

</body>
</html>
